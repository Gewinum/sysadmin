<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SysAdmin — ბილეთების ტრენაჟორი</title>
<style>
:root{color-scheme:light;--bg:#f6f4ef;--card:#fff;--ink:#1d2330;--mute:#6b7180;--line:#e4e0d6;--acc:#1f5c99;--acc2:#e8f0f9;--ok:#1f7a4a;--okbg:#e6f4ec;--bad:#b3261e;--badbg:#fbe9e7;--warn:#8a5a00;--warnbg:#fff4dc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Georgian","BPG Arial","Sylfaen","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.5}
header{background:#14233a;color:#fff;padding:18px 20px 0}
header h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.2px}
header p{margin:4px 0 12px;color:#b9c4d6;font-size:13.5px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:transparent;border:0;color:#c9d3e3;padding:10px 14px;font:inherit;font-size:14.5px;cursor:pointer;border-radius:8px 8px 0 0}
nav button.on{background:var(--bg);color:var(--ink);font-weight:700}
main{max-width:920px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-size:14.5px;cursor:pointer}
.btn.sec{background:var(--acc2);color:var(--acc)}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.btn:disabled{opacity:.45;cursor:default}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--acc2);color:var(--acc);margin-right:6px;vertical-align:middle}
.chip.v{background:var(--warnbg);color:var(--warn)}
.chip.a{background:#efe9fb;color:#5b3aa6}
h2{font-size:18px;margin:22px 0 4px}
h3{font-size:16px;margin:0 0 8px}
.q{font-weight:600;margin:4px 0 10px}
.opt{display:block;width:100%;text-align:left;background:#fbfaf7;border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;font:inherit;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:#b8c6d8}
.opt.sel{border-color:var(--acc);background:var(--acc2)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt .l{font-weight:700;margin-right:8px;color:var(--mute)}
.ans{background:var(--okbg);border-left:4px solid var(--ok);padding:10px 12px;border-radius:6px;margin-top:10px;white-space:pre-wrap}
.expl{color:var(--mute);font-size:14px;margin-top:8px}
textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:15px;resize:vertical;background:#fdfcfa}
.self{display:flex;gap:8px;margin-top:8px}
.self button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit;font-size:14px}
.self button.okb.on{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.self button.badb.on{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.score{font-size:22px;font-weight:700}
.mute{color:var(--mute);font-size:14px}
.filters label{margin-right:14px;font-size:14.5px;cursor:pointer;white-space:nowrap}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
.bar>div{height:100%;background:var(--acc)}
.flash{min-height:180px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;text-align:center;font-size:17px}
.flash .back{margin-top:14px;text-align:left;background:var(--okbg);padding:12px;border-radius:8px;font-size:15.5px}
input[type=search]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit}
.list .item{border-bottom:1px solid var(--line);padding:10px 0}
.list .item:last-child{border-bottom:0}
.hide{display:none}
.num{display:inline-block;min-width:26px;color:var(--mute);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat b{display:block;font-size:22px}
.note{background:var(--warnbg);border:1px solid #f0dca8;color:#5f4300;border-radius:10px;padding:12px 14px;font-size:14.5px}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:#fff}
</style>
</head>
<body>
<header>
  <h1>Windows Server სისტემური ადმინისტრირება — ბილეთების ტრენაჟორი</h1>
  <p>ქვიზები 1–4, თეორიული ნაწილი (ლაბების გარეშე) · განმარტებები, ღია კითხვები და ტესტები, მათ შორის გადაფორმულირებული ვარიანტები</p>
  <nav id="nav">
    <button data-t="home" class="on">მთავარი</button>
    <button data-t="ticket">ბილეთი</button>
    <button data-t="tests">ტესტები</button>
    <button data-t="flash">ბარათები</button>
    <button data-t="mist">შეცდომები</button>
    <button data-t="all">მთელი ბაზა</button>
  </nav>
</header>
<main>
<section id="home"></section>
<section id="ticket" class="hide"></section>
<section id="tests" class="hide"></section>
<section id="flash" class="hide"></section>
<section id="mist" class="hide"></section>
<section id="all" class="hide"></section>
</main>
<script>
const DEFS=[],OPENS=[],TESTS=[];
function D(q,t,d){DEFS.push({q,t,d})}
function O(q,t,a,v){OPENS.push({q,t,a,v:!!v})}
function T(q,s,o,a,e,orig){TESTS.push({q,s,o,a:Array.isArray(a)?a:[a],e:e||"",kind:orig===0?"orig":"var"})}
// ===================== ქვიზი 1 =====================
D(1,"ჰოსთი (Host)","ქსელში ჩართული ნებისმიერი მოწყობილობა, რომელსაც ქსელურ ინტერფეისზე მინიჭებული აქვს IP მისამართი და ითხოვს ან უზრუნველყოფს ქსელურ რესურსებს (მაგ. კლიენტები, სერვერები, როუტერები).");
D(1,"ნოუდი (Node)","ნებისმიერი მოწყობილობა, რომელსაც შეუძლია ქსელური მონაცემების მიღება და გადაცემა, თუმცა მის ძირითად საკომუნიკაციო ინტერფეისს შეიძლება არ ჰქონდეს IP მისამართი (მაგ. სვიჩი). ყველა ჰოსტი ნოუდია, მაგრამ ყველა ნოუდი ჰოსტი არ არის.");
D(1,"კლიენტი (Client)","კომპიუტერი ან მოწყობილობა ქსელში, რომელიც ითხოვს წვდომას სხვა კომპიუტერებზე (სერვერებზე) არსებულ რესურსებსა და სერვისებზე.");
D(1,"სერვერი (Server)","კომპიუტერი ან პროგრამული სისტემა, რომელიც პასუხისმგებელია კლიენტებისთვის ქსელური სერვისების, ფაილებისა და რესურსების მიწოდებასა და წვდომის მართვაზე.");
D(1,"PAN (Personal Area Network)","პერსონალური ქსელი, რომელიც აერთიანებს მოწყობილობებს მცირე კერძო სივრცეში (მაგ. Bluetooth ან Wi-Fi ტექნოლოგიით).");
D(1,"MAN (Metropolitan Area Network)","ქალაქის ან მუნიციპალიტეტის გეოგრაფიულ საზღვრებში გაერთიანებული ლოკალური ქსელების (LAN) სისტემა.");
D(1,"LAN (Local Area Network)","ლოკალური ქსელი, რომელიც აერთიანებს კომპიუტერებს მცირე გეოგრაფიულ არეალში (ერთ ოთახში, შენობაში ან მომიჯნავე ნაგებობებში).");
D(1,"WAN (Wide Area Network)","ფართო არეალის (გლობალური) ქსელი, რომელიც ფარავს დიდ გეოგრაფიულ სივრცეებს სატელეკომუნიკაციო არხებისა და სატელიტების საშუალებით (მაგ. ინტერნეტი).");
D(1,"კლასტერი (Cluster)","ორი ან მეტი დამოუკიდებელი სერვერის გაერთიანება, რომლებიც მოქმედებენ როგორც ერთიანი სისტემა მაღალი ხელმისაწვდომობისა (High Availability) და ხარვეზგამძლეობის (Fault Tolerance) უზრუნველსაყოფად.");
D(1,"On-premises server","სერვერი, რომელიც ფიზიკურად განთავსებულია უშუალოდ ორგანიზაციის შენობაში ან კერძო სერვერულში.");
D(1,"Cloud server","სერვერი, რომელიც განთავსებულია ინტერნეტში არსებულ მონაცემთა ცენტრში (ღრუბელში) და წვდომადია დისტანციურად.");
D(1,"Virtual machine (ვირტუალური მანქანა)","ჰიპერვიზორის მიერ ფიზიკურ აპარატურაზე გაშვებული პროგრამულად ემულირებული სრული ოპერაციული სისტემა (Guest OS).");
D(1,"NOS (Network Operating System)","ქსელური ოპერაციული სისტემა, რომელიც მართავს ქსელურ რესურსებს, მომხმარებლებს, უსაფრთხოებასა და სერვისებს (მაგ. Windows Server, Linux Server).");
D(1,"NTFS (New Technology File System)","Windows-ის ძირითადი ფაილური სისტემა, რომელიც უზრუნველყოფს წვდომის კონტროლის სიებს (DACL), EFS შიფრაციას, კვოტებსა და დედუპლიკაციას.");
D(1,"Local User Account","კონკრეტულ კომპიუტერზე შექმნილი მომხმარებლის ანგარიში, რომელიც ინახება და ავტენტიფიცირდება ლოკალური SAM მონაცემთა ბაზის მიერ.");
D(1,"Local Group Account","ლოკალურ SAM ბაზაში არსებული ჯგუფი, რომელიც აერთიანებს რამდენიმე ლოკალურ მომხმარებელს უფლებებისა და ნებართვების ჯგუფურად მინიჭების გასამარტივებლად.");
D(1,"User Rights","სისტემური დონის უფლებამოსილებები, რომლებიც განსაზღვრავენ მომხმარებლის ან ჯგუფის შესაძლებლობას განახორციელოს კონკრეტული სისტემური მოქმედებები (მაგ. სისტემაში შესვლა, გათიშვა, სარეზერვო ასლის შექმნა).");
D(1,"Permissions","წვდომის წესები (მაგ. Read, Write, Full Control), რომლებიც განსაზღვრავენ კონკრეტულ რესურსზე (ფაილზე, საქაღალდეზე, პრინტერზე) მომხმარებლის ან ჯგუფის უფლებებს.");
D(1,"SAM (Security Accounts Manager)","ლოკალური მონაცემთა ბაზა, სადაც ინახება Windows-ის ლოკალური მომხმარებლებისა და ჯგუფების ანგარიშები და პაროლების ჰეშები.");
D(1,"SID (Security Identifier)","ანგარიშის/ობიექტის უნიკალური იდენტიფიკატორი; ანგარიშის წაშლისას SID უქმდება და ხელახლა აღარასდროს გამოიყენება.");
D(1,"Standalone Server","Windows Server, რომელიც არის Workgroup-ის წევრი და არ შედის Active Directory დომენში.");
D(1,"ჰიპერვიზორი Type 1 (Bare-metal)","ჰიპერვიზორი, რომელიც ინსტალირდება პირდაპირ ფიზიკურ აპარატურაზე მასპინძელი OS-ის გარეშე; მაღალი წარმადობა (მაგ. Hyper-V, VMware ESXi, KVM).");
D(1,"ჰიპერვიზორი Type 2 (Hosted)","ჰიპერვიზორი, რომელიც ინსტალირდება არსებულ მასპინძელ OS-ზე (Host OS); VM-ები აპარატურას წვდებიან ჰიპერვიზორისა და Host OS-ის გავლით (მაგ. VMware Workstation, VirtualBox).");
D(1,"ISO ფაილი","ოპტიკური დისკის (DVD/CD) სექტორული, ზუსტი ციფრული ასლი/არქივი; გამოიყენება OS-ის ინსტალაციისთვის VM-ში ან იწერება DVD/USB-ზე (Rufus, Burnaware).");
D(1,"Rack-mountable server","სერვერი, რომელიც თავსდება ვერტიკალურ თაროში (Rack); სიმაღლე იზომება იუნიტებში (1U = 1.75 ინჩი); იზიარებს KVM-ს, UPS-ს, SAN-ს.");
D(1,"Blade server","მცირე ზომის მოდულური სერვერი („ბლეიდი“), რომელიც თავსდება საერთო შასიში (Chassis) სივრცისა და ენერგიის დაზოგვისთვის.");
D(1,"Tower server","ვერტიკალურად მდგომი, ცალკე კორპუსის მქონე სერვერი (PC-ის მსგავსი); გამოიყენება SOHO გარემოში ან ტესტირებისთვის.");
D(1,"System Insights","Windows Server 2019-ის პროგნოზირებადი ანალიტიკის ფუნქცია, რომელიც მანქანური სწავლებით ლოკალურად აანალიზებს CPU-ს, ქსელისა და საცავის მოხმარების ტენდენციებს.");
D(1,"Windows Admin Center","ვებ-ბრაუზერზე დაფუძნებული სერვერის მართვის თანამედროვე აპლიკაცია სერვერების, Server Core-ის, კლასტერების, Hyper-V-ისა და Azure-ის ცენტრალიზებული მართვისთვის.");
D(1,"Hybrid cloud support","ლოკალური (On-premises) სერვერების ინტეგრაცია Azure-თან: Azure Backup, Azure File Sync, Azure Site Recovery, Azure Update Management.");
D(1,"Storage Migration Service","WS2019-ის ფუნქცია, რომელიც ავტომატურად ახდენს მონაცემების, შეარების, უსაფრთხოების პარამეტრებისა და სერვერის იდენტობის მიგრაციას ძველი სერვერებიდან ახალ WS2019-ზე ან Azure-ში.");
D(1,"Storage Replica","ტომების ბლოკურ დონეზე სინქრონული ან ასინქრონული რეპლიკაცია სერვერებს/კლასტერებს შორის Disaster Recovery-სა და Stretch Cluster-ისთვის.");
D(1,"Storage Spaces","ფუნქცია, რომელიც რამდენიმე ფიზიკურ დისკს აერთიანებს ერთ დიდ და ხარვეზგამძლე ტომად.");

D(1,"ოპერაციული სისტემა","პროგრამული უზრუნველყოფა, რომელიც მართავს კომპიუტერის აპარატურულ და პროგრამულ რესურსებს და უზრუნველყოფს პლატფორმას აპლიკაციების გასაშვებად.");

O(1,"რა არის ოპერაციული სისტემა?","პროგრამული უზრუნველყოფა, რომელიც მართავს კომპიუტერის აპარატურულ (Hardware) და პროგრამულ რესურსებს და უზრუნველყოფს პლატფორმასა და სერვისებს სხვადასხვა აპლიკაციის გასაშვებად.");
O(1,"რა არის ქსელური ოპერაციული სისტემა (NOS)?","პროგრამული უზრუნველყოფა, რომელსაც შეუძლია ქსელური რესურსების, ფაილების, აპლიკაციებისა და ვებ-სერვისების მართვა, შენახვა და მიწოდება, ასევე მომხმარებლების, კომპიუტერებისა და უსაფრთხოების ცენტრალიზებული ადმინისტრირება (მაგ. Windows Server, Linux Server, macOS Server).");
O(1,"რა არის სასერვერო ოპერაციული სისტემა?","სპეციალიზებული OS, რომელიც ოპტიმიზებულია ქსელში რესურსების გაზიარების, დიდი დატვირთვის დამუშავების, მაღალი წარმადობისა და კლიენტებისთვის ქსელური სერვისების საიმედოდ მიწოდებისთვის.");
O(1,"რა არის კომპიუტერული ქსელი?","ერთმანეთთან დაკავშირებული კომპიუტერებისა და მოწყობილობების ჯგუფი, რომლის ძირითადი დანიშნულებაა რესურსების (მონაცემები, ქსელური სერვისები, პერიფერიული მოწყობილობები) გაზიარება.");
O(1,"რა სხვაობაა ჰოსტსა (host) და ნოუდს (node) შორის?","ჰოსტი — ქსელური ინტერფეისის მქონე მოწყობილობა IP მისამართით, რომელიც ითხოვს ან გასცემს რესურსებს (კლიენტი, სერვერი, როუტერი). ნოუდი — ნებისმიერი მოწყობილობა, რომელიც იღებს/გადასცემს მონაცემებს, მაგრამ ძირითად ინტერფეისს შეიძლება არ ჰქონდეს IP (მაგ. სვიჩი). ყველა ჰოსტი ნოუდია, მაგრამ ყველა ნოუდი ჰოსტი არ არის.");
O(1,"რა მეთოდები არსებობს Windows Server 2019-ის შესაქმნელად და დასაინსტალირებლად?","1) Clean installation — DVD/USB/ISO-დან; 2) Network installation — WDS-ით; 3) Unattended installation — Windows ADK და MDT; 4) In-place upgrade — არსებული OS-ის განახლება; 5) Migration — როლების/მონაცემების გადატანა WSMT-ით; 6) Virtual Machine installation — ISO-ს ვირტუალურ DVD-ზე მიერთებით.");
O(1,"რა ვერსიები (Editions) გააჩნია Windows Server 2019-ს?","Essentials — მცირე ორგანიზაციებისთვის (25 მომხმარებელი / 50 მოწყობილობა); Standard — საშუალო ორგანიზაციებისთვის, 2 VM; Datacenter — დიდი მონაცემთა ცენტრები/ღრუბელი, ულიმიტო ვირტუალიზაცია; სპეციალიზებული: Windows Storage Server 2019 და Microsoft Hyper-V Server 2019 (უფასო ჰიპერვიზორი).");
O(1,"რა ხელსაწყოები (თულები) აქვს შემოთავაზებული ადმინისტრატორს?","Server Manager (გრაფიკული კონსოლი როლებისთვის); Windows PowerShell / cmdlets (სკრიპტინგი/ავტომატიზაცია); Windows Admin Center (ვებ-ბრაუზერზე დაფუძნებული); MMC Snap-ins (Disk Management, Event Viewer, Device Manager, Local Users & Groups, AD ინსტრუმენტები); sconfig.cmd (Server Core-ისთვის).");
O(1,"ზომისა და ფორმ-ფაქტორის მიხედვით რა სახის სერვერები გამოიყოფა?","1) Rack-mountable — თაროში, სიმაღლე იუნიტებში (1U=1.75 ინჩი); 2) Blade — მოდულური, საერთო შასიში; 3) Tower — ცალკე მდგომი, PC-ის მსგავსი კორპუსი, SOHO/ტესტირება.");
O(1,"რა განსხვავებაა ჰიპერვიზორ Type 1-სა და Type 2-ს შორის?","Type 1 (Bare-metal) — პირდაპირ აპარატურაზე, Host OS-ის გარეშე, მაღალი წარმადობა (Hyper-V, ESXi, KVM). Type 2 (Hosted) — არსებულ Host OS-ზე, VM-ები აპარატურას წვდებიან ჰიპერვიზორისა და Host OS-ის გავლით (VMware Workstation, VirtualBox).");
O(1,"ჩამოწერე ტიპიური პოსტ-ინსტალაციური ამოცანები.","1) დრო და Time Zone; 2) IP კონფიგურაცია (სტატიკური IP, Subnet mask, Gateway, DNS); 3) კომპიუტერის სახელის შეცვლა და დომენში/ჯგუფში გაწევრიანება; 4) Firewall-ის წესები; 5) Remote Desktop-ის ჩართვა; 6) თანამედროვე ბრაუზერი და IE ESC-ის გათიშვა; 7) Windows Update; 8) აქტივაცია.");
O(1,"IP-ის რა ვერსიები გამოიყენება პრაქტიკაში და რა სხვაობაა მათ შორის?","IPv4 — 32-ბიტიანი, 4 ოქტეტი (192.168.1.10), Network ID + Host ID, სივრცე ამოწურულია. IPv6 — 128-ბიტიანი, უზარმაზარი სივრცე, ავტომატური კონფიგურაცია (ICMPv6).");
O(1,"სერვერის ფიზიკურ კომპლექტაციაში რა კომპონენტებს უნდა მივაქციოთ ყურადღება?","CPU (სიხშირე, ქეში, ბირთვები, 64-ბიტი, Intel VT/AMD-V SLAT-ით); RAM (მოცულობა, ECC, გაფართოება); დისკები (SSD/NVMe/SAS/SATA, სიჩქარე, RAID კონტროლერი); NIC (1/10 Gbps, PXE, NIC Teaming); კვება/გაგრილება (Redundant PSU, UPS); დედაპლატა/BIOS (UEFI, TPM).");
O(1,"რა ვარიანტებია შემოთავაზებული Evaluation Center-ზე Windows Server 2019-ის გასატესტად?","უფასო 180-დღიანი საცდელი ვერსია ფორმატებში: ISO იმიჯი, VHD (Virtual Hard Disk), Azure-ში ტესტირება; ასევე Server Core App Compatibility Feature on Demand (FOD) პაკეტი.");
O(1,"რას წარმოადგენს ISO ფაილი?","ოპტიკური დისკის (DVD/CD) სექტორული ზუსტი ციფრული ასლი/არქივი. გამოიყენება OS-ის ჩასატვირთად VM-ში (ვირტუალურ DVD-ზე მიერთებით) ან იწერება DVD-ზე/ჩატვირთვად USB-ზე (Burnaware, Rufus).");
O(1,"რა სამი ძირითადი მეთოდია Windows Server-ის ადმინისტრირებისთვის?","1) GUI — Server Manager და MMC Snap-ins; 2) Windows PowerShell — cmdlets და სკრიპტები; 3) Windows Admin Center — ვებ-ბრაუზერზე დაფუძნებული მართვა.");
O(1,"რას მოიცავს Windows Server-ში მონაცემთა საცავების (Data Storage) არქიტექტურა?","ლოკალური საცავები და ფაილური სისტემები (NTFS, ReFS, Basic/Dynamic დისკები, MBR/GPT); RAID (პროგრამული, ფირმვერული, აპარატურული; RAID 0,1,5); SDS (Storage Pools, Virtual Disks, Storage Spaces, S2D); ქსელური საცავები SAN/NAS (iSCSI, Fibre Channel, MPIO, SMB, NFS); ოპტიმიზაცია (Data Deduplication, Storage Tiers, Storage Pinning, Storage Replica, Storage Migration Service).");
O(1,"დაახასიათეთ P2P ქსელის არქიტექტურა.","P2P-ში (Workgroup) კომპიუტერებს არ აქვთ ფიქსირებული როლები; ყველა თანაბარია; თითოეული დამოუკიდებლად მართავს რესურსებს, მომხმარებლებსა და უსაფრთხოებას. ჰოსტი კლიენტია, როცა ითხოვს რესურსს, და სერვერი, როცა გასცემს.");
O(1,"დაახასიათეთ Rack-mountable servers.","თავსდება სერვერულ ოთახებში/მონაცემთა ცენტრებში ვერტიკალურ თაროებში; სიმაღლე იუნიტებით (1U = 1.75 ინჩი; 1U, 2U, 4U); იზიარებენ საერთო კომპონენტებს — KVM სვიჩი, UPS, SAN.");
O(1,"დაახასიათეთ Blade servers.","მცირე ზომის მოდულური სერვერები („ბლეიდები“), მონტაჟდება საერთო შასიში (Chassis) სივრცისა და ენერგიის დასაზოგად; გამოიყენება მონაცემთა ცენტრებსა და სუპერკომპიუტერულ ობიექტებში.");

D(2,"Namespace (სახელთა სივრცე)","იერარქიული დასახელების სტრუქტურა; საერთო ძირითადი DNS სახელი = Contiguous Namespace, სხვადასხვა ხის დომენები = Disjointed Namespace.");
D(2,"Site (საიტი)","AD-ის ფიზიკური ტოპოლოგიის ობიექტი — IP სუბნეტების გაერთიანება, რომელიც წარმოადგენს ფიზიკურ ლოკაციას (LAN) და ოპტიმიზაციას უკეთებს რეპლიკაციასა და ავტენტიფიკაციას.");
D(2,"Hostname","კომპიუტერის/მოწყობილობის უნიკალური ლოგიკური სახელი ქსელში, რომელიც გამოიყენება DNS/FQDN დასახელებებში.");
D(2,"WINS (Windows Internet Name Service)","Microsoft-ის სერვისი, რომელიც NetBIOS სახელებს გარდაქმნის IP მისამართებად და ამცირებს ბროადქასტებს.");
D(2,"GUID (Globally Unique Identifier)","128-ბიტიანი გლობალურად უნიკალური იდენტიფიკატორი, რომელიც ენიჭება AD-ის ყოველ ობიექტს და განასხვავებს მას მთელ ტყეში.");
D(2,"GPO (Group Policy Object)","AD ობიექტი ცენტრალიზებული პარამეტრებითა და შეზღუდვებით (Computer Configuration და User Configuration), რომელიც ვრცელდება საიტზე, დომენზე ან OU-ზე.");
D(2,"Hypervisor (ჰიპერვიზორი)","პროგრამული შრე, რომელიც მართავს ფიზიკურ რესურსებს და უზრუნველყოფს რამდენიმე OS-ის (VM) ერთდროულ გაშვებას; Hyper-V — Type 1.");
D(2,"VMBus","Hyper-V-ის მაღალსიჩქარიანი ლოგიკური არხი, რომელიც აკავშირებს VSP-სა (Virtualization Service Provider) და VSC-ს (Virtualization Service Consumer).");
D(2,"Snapshot / Checkpoint","Hyper-V-ის ფუნქცია, რომელიც იღებს VM-ის დისკისა და სისტემის მდგომარეობის ასლს დროის კონკრეტულ მომენტში, რათა შემდეგ დავაბრუნოთ ამ მდგომარეობაში.");
D(2,"Nested Virtualization","Hyper-V-ის ფუნქცია, რომელიც იძლევა VM-ში Hyper-V-ის დაყენებისა და სხვა VM-ების გაშვების საშუალებას.");
D(2,".vhdx","Hyper-V-ის თანამედროვე ვირტუალური დისკის ფორმატი 64 TB-მდე (ძველი .vhd — 2 TB-მდე).");
D(2,"RODC (Read-Only Domain Controller)","წაკითხვადი DC ფილიალებისთვის დაბალი ფიზიკური უსაფრთხოების პირობებში; ინახავს AD ბაზის მხოლოდ წაკითხვად ასლს.");
D(2,"Replication (რეპლიკაცია)","პროცესი, რომლის დროსაც AD ბაზის ცვლილებები ავტომატურად სინქრონიზდება DC-ებს შორის.");
D(2,"Global Catalog (GC)","DC, რომელიც ინახავს ტყის ყველა ობიექტის ძირითადი ატრიბუტების ნაწილობრივ ასლს; სწრაფი ძიება და Universal ჯგუფების წევრობის შემოწმება.");
D(2,"FSMO როლები","5 სპეციალური როლი, რომლებიც ერთ დროს მხოლოდ ერთ DC-ზეა: Schema Master, Domain Naming Master (ტყის დონე); PDC Emulator, RID Master, Infrastructure Master (დომენის დონე).");
D(2,"Schema Master","ტყის დონის FSMO როლი — პასუხისმგებელია AD სქემის ცვლილებებზე.");
D(2,"Domain Naming Master","ტყის დონის FSMO როლი — მართავს ტყეში დომენების დამატებას/წაშლას.");
D(2,"PDC Emulator","დომენის დონის FSMO როლი — პაროლის ცვლილებების კოორდინაცია, დროის სინქრონიზაცია, ძველ სისტემებთან თავსებადობა.");
D(2,"RID Master","დომენის დონის FSMO როლი — გასცემს RID დიაპაზონებს DC-ებზე უნიკალური SID-ების შესაქმნელად.");
D(2,"Infrastructure Master","დომენის დონის FSMO როლი — კოორდინაციას უწევს ჯგუფების წევრობას, GUID-ებსა და DN-ებს დომენებს შორის.");
D(2,"AD Schema (სქემა)","წესების ნაკრები, რომელიც განსაზღვრავს AD-ში ნებადართულ ობიექტთა ტიპებს (Classes) და მათ თვისებებს (Attributes).");
D(2,"Leaf Object","ინდივიდუალური ობიექტი (User, Group, Computer, Printer), რომელიც სხვა ობიექტებს ვერ შეიცავს.");
D(2,"DN / CN","LDAP ფორმატის დასახელებები, რომლებიც მიუთითებენ ობიექტის ზუსტ ადგილს AD იერარქიაში (მაგ. CN=J.Eckert,OU=IT,DC=domain1,DC=com).");
D(2,"Security Group","ჯგუფის ტიპი, რომელიც გამოიყენება რესურსებზე უფლებებისა და ნებართვების ჯგუფურად მისანიჭებლად.");
D(2,"Distribution Group","ჯგუფის ტიპი მხოლოდ ელფოსტის ჯგუფური დაგზავნისთვის (მაგ. Exchange); უსაფრთხოების ნებართვები ვერ მიენიჭება.");
D(2,"Domain Local Group","სკოუპი: წევრები ტყის ნებისმიერი დომენიდან, ნებართვები — მხოლოდ იმავე დომენის რესურსებზე.");
D(2,"Global Group","სკოუპი: წევრები მხოლოდ იმავე დომენიდან, ნებართვები — ტყის ნებისმიერ დომენში.");
D(2,"Universal Group","სკოუპი: წევრები ტყის ნებისმიერი დომენიდან, ნებართვები ტყის ნებისმიერ რესურსზე; წევრობა ინახება Global Catalog-ში.");
D(2,"AGDLP / AGUDLP","Microsoft-ის რეკომენდებული ჯგუფების ჩაშენების სტრატეგია: Accounts → Global → [Universal] → Domain Local → Permissions.");
D(2,"Trust Relationship (ნდობა)","მექანიზმი, რომელიც ერთი დომენის მომხმარებლებს აძლევს მეორე დომენის რესურსებზე წვდომას; შეიძლება იყოს Transitive, One-way/Two-way, Internal, External, Forest, Realm.");
D(2,"Functional Levels (DFL / FFL)","განსაზღვრავს Windows Server-ის მინიმალურ ვერსიას DC-ებზე დომენში (DFL) ან ტყეში (FFL) და რთავს შესაბამის ფუნქციონალს.");
D(2,"AD-Integrated DNS","DNS ზონები, რომლებიც ინახება AD ბაზაში და რეპლიცირდება DC-ებს შორის; მხარს უჭერს Secure Dynamic Updates-ს.");
D(2,"Azure AD","Microsoft-ის ღრუბლოვანი იდენტობის სერვისი, რომელსაც შეუძლია ლოკალური AD-ის სინქრონიზაცია.");
D(2,"Kerberos","პროტოკოლი მომხმარებლებისა და სერვერების უსაფრთხო ავტენტიფიკაციისთვის დომენში; გასცემს ბილეთებს (Tickets).");
D(2,"SID (AD ობიექტის)","უნიკალური იდენტიფიკატორი, რომელიც ენიჭება ყოველ ობიექტს და გამოიყენება ACL-ებში.");
D(2,"hosts ფაილი","C:\\Windows\\system32\\drivers\\etc-ში მდებარე ფაილი IP ↔ FQDN/Hostname ხელით გაწერილი შესაბამისობებით (DNS რეზოლუცია).");
D(2,"lmhosts ფაილი","LAN Manager hosts — IP ↔ NetBIOS სახელის შესაბამისობები (NetBIOS რეზოლუცია).");
D(2,"Primary Zone","DNS ზონა ზონის ფაილის Read-Write პირველადი ასლით.");
D(2,"Secondary Zone","DNS ზონა Read-Only ასლით, რომელსაც იღებს Primary-დან Zone Transfer-ით.");
D(2,"Stub Zone","არაავტორიტეტული DNS ზონა მხოლოდ SOA, NS და Glue A ჩანაწერებით.");
D(2,"DNS Forwarder","DNS სერვერის პარამეტრი, რომელიც პასუხის არ მქონე მოთხოვნებს გადაამისამართებს სხვა (მაგ. ISP-ის) DNS სერვერზე.");
D(2,"Users კონტეინერი","AD-ის ნაგულისხმევი ჩაშენებული კონტეინერი (არა OU), შეიცავს Administrator-ს, Guest-ს და ჯგუფებს (Domain Admins, Domain Users...); მასზე GPO ვერ მიებმება.");
D(2,"Intrasite Replication","რეპლიკაცია საიტის შიგნით (LAN) — დაუყოვნებლივ და შეუკუმშავად.");
D(2,"Intersite Replication","რეპლიკაცია საიტებს შორის WAN-ით — იმართება Site Link-ით (განრიგი/ინტერვალი) და Bridgehead სერვერებით.");
D(2,"Generation 2 VM","Hyper-V-ის VM, რომელიც იყენებს UEFI-ს (Secure Boot), VMBus სინთეტიკურ აპარატურას; მხოლოდ 64-ბიტიანი OS.");
D(2,"Production Checkpoint","Checkpoint, რომელიც იყენებს სტუმარი OS-ის VSS-ს (ან fsfreeze) აპლიკაციურად მყარი ასლისთვის, მეხსიერების მდგომარეობის გარეშე.");
D(2,"Standard Checkpoint","Checkpoint, რომელიც ინახავს დისკსაც და გაშვებული პროგრამების მეხსიერების მდგომარეობასაც.");
D(2,"Private Virtual Switch","Hyper-V კომუტატორი — კომუნიკაცია მხოლოდ VM-ებს შორის.");
D(2,"Internal Virtual Switch","Hyper-V კომუტატორი — კომუნიკაცია VM-ებსა და Host OS-ს შორის.");
D(2,"External Virtual Switch","Hyper-V კომუტატორი — VM-ებს აკავშირებს ფიზიკურ ქსელთან ფიზიკური NIC-ით.");
D(2,"SLAT (Second Level Address Translation)","CPU-ს ტექნოლოგია, რომლის მხარდაჭერა აუცილებელია Hyper-V როლის დასაყენებლად.");

O(2,"რა არის Active Directory?","Microsoft-ის იერარქიული, განაწილებული დირექტორიის სერვისი და მონაცემთა ბაზა (ITU X.500), რომელიც ცენტრალიზებულად ინახავს ინფორმაციას ქსელური ობიექტების (მომხმარებლები, ჯგუფები, კომპიუტერები, პრინტერები, სერვისები) შესახებ, უზრუნველყოფს ცენტრალიზებულ ავტენტიფიკაციას (SSO) და Group Policy-ით პარამეტრების მართვას.");
O(2,"რა არის AD-ის ტიპური ობიექტები?","Leaf Objects — User, Group, Computer accounts, გაზიარებული პრინტერები (სხვა ობიექტებს ვერ შეიცავენ). Container Objects — Domain, OU, Site, Default Containers (Users, Computers, Builtin, Domain Controllers). ტიპები და ატრიბუტები განსაზღვრულია Schema-ში.");
O(2,"რა პროტოკოლებსა და სერვისებს იყენებს AD?","LDAP — ობიექტების ძიება/წაკითხვა/მოდიფიკაცია; Kerberos — უსაფრთხო ავტენტიფიკაცია (Tickets); DNS — DC-ების მოძებნა SRV ჩანაწერებით (_ldap, _kerberos); SMB/DFSR — SYSVOL-ისა და GPO-ების რეპლიკაცია; IP/SMTP — DC-ებს შორის რეპლიკაცია (SMTP მხოლოდ Schema და Configuration partition-ისთვის).");
O(2,"რა განსხვავებაა სამუშაო ჯგუფსა და დომენს შორის?","Workgroup: P2P, თითოეული კომპიუტერი ინახავს ლოკალურ SAM ბაზას, მართვა დეცენტრალიზებულია, მცირე გარემოსთვის (<10 კომპიუტერი). Domain: Client/Server, ცენტრალიზებული AD ბაზა DC-ზე, Group Policy და SSO, ნებისმიერი ზომის ორგანიზაციისთვის.");
O(2,"რა ფუნქციონალური დონეები არსებობს და რა სხვაობაა მათ შორის?","Domain Functional Level (DFL) — მინიმალური Windows Server ვერსია DC-ებზე ერთ დომენში, ფუნქციები ამ დომენში. Forest Functional Level (FFL) — მინიმალური DFL მთელ ტყეში, ფუნქციები მთელ ტყეში. მაგ. AD Recycle Bin-ისთვის FFL მინიმუმ Windows Server 2008 R2.");
O(2,"რა არის replication topology?","საკომუნიკაციო გზებისა და კავშირების ნაკრები, რომლითაც AD ცვლილებები სინქრონიზდება DC-ებს შორის. Intrasite (საიტის შიგნით, LAN) — დაუყოვნებლივ, შეუკუმშავად; Intersite (საიტებს შორის, WAN) — Site Link-ით (განრიგი, ინტერვალი) და Bridgehead სერვერებით.");
O(2,"რა სხვაობაა hosts და lmhosts ფაილებს შორის?","ორივე C:\\Windows\\system32\\drivers\\etc-შია. hosts — DNS რეზოლუციისთვის: IP ↔ FQDN/Hostname. lmhosts — NetBIOS რეზოლუციისთვის: IP ↔ NetBIOS სახელი.");
O(2,"როგორია DNS რეზოლუცია (Forward Lookup)?","1) კლიენტი ამოწმებს DNS cache-ს და hosts ფაილს; 2) მიმართავს Preferred DNS სერვერს; 3) თუ სერვერს ქეშში აქვს — პასუხობს; 4) თუ არა — Root hints → TLD (.com) → Authoritative სერვერი (ან Forwarder); 5) პასუხი ქეშირდება TTL-ით და გადაეცემა კლიენტს.");
O(2,"როგორია NetBIOS რეზოლუცია?","1) NetBIOS ქეში ან lmhosts; 2) თუ WINS კონფიგურირებულია — მიმართავს WINS-ს; 3) თუ არა — NetBIOS Broadcast ლოკალურ LAN-ში; 4) როუტერები ბროადქასტს არ ატარებენ, ამიტომ მუშაობს მხოლოდ იმავე სეგმენტში.");
O(2,"რა DNS ზონები არსებობს და რა სხვაობაა მათ შორის?","Primary — Read-Write პირველადი ასლი; Secondary — Read-Only ასლი Zone Transfer-ით; AD-Integrated Primary — ინახება AD-ში, ყველა DC-ს Read-Write ასლი, Secure Dynamic Updates; Stub — არაავტორიტეტული, მხოლოდ SOA, NS, Glue A.");
O(2,"რას აკეთებს WINS სერვერი?","დინამიურად გარდაქმნის NetBIOS სახელებს IPv4 მისამართებად, ამცირებს Broadcast ტრაფიკს და იძლევა რეზოლუციას სხვადასხვა LAN სეგმენტებს შორის (როუტერების გავლით).");
O(2,"რას წარმოადგენს Users კონტეინერი?","AD-ის ნაგულისხმევი ჩაშენებული კონტეინერი, იქმნება დომენთან ერთად; შეიცავს Administrator-ს, გათიშულ Guest-ს, ჯგუფებს (Domain Admins, Domain Users, Domain Guests; root-ში Schema Admins, Enterprise Admins). ეს Container-ია და არა OU, ამიტომ მასზე GPO ვერ მიებმება.");
O(2,"რა ჯგუფები გამოიყოფა ჯგუფის ტიპის მიხედვით და რა სხვაობაა?","Security Groups — რესურსებზე ნებართვების/უფლებების მისანიჭებლად. Distribution Groups — მხოლოდ ელფოსტის დაგზავნისთვის (Exchange), ნებართვები ვერ მიენიჭება.");
O(2,"რა ჯგუფები გამოიყოფა ჯგუფის სკოუპის მიხედვით და რა სხვაობაა?","Domain Local — წევრები ტყის ნებისმიერი დომენიდან, ნებართვები მხოლოდ საკუთარ დომენში. Global — წევრები მხოლოდ საკუთარი დომენიდან, ნებართვები ტყის ნებისმიერ დომენში. Universal — წევრებიც და ნებართვებიც მთელ ტყეში; წევრობა Global Catalog-შია.");
O(2,"რა არის AGDLP / AGUDLP?","Microsoft-ის რეკომენდებული Group Nesting სტრატეგია. AGDLP (ერთი დომენი): Accounts → Global → Domain Local → Permissions. AGUDLP (მრავალდომენიანი ტყე): Accounts → Global → Universal → Domain Local → Permissions.");
O(2,"რა განსხვავებაა Type 1 და Type 2 ჰიპერვიზორებს შორის და რომელს მიეკუთვნება Hyper-V?","Type 1 (Bare-metal) — პირდაპირ აპარატურაზე, მცირე მართვის OS, მაღალი წარმადობა. Type 2 (Hosted) — Host OS-ზე. Hyper-V — Type 1.");
O(2,"რა განსხვავებაა Generation 1 და Generation 2 VM-ებს შორის Hyper-V-ში?","Gen 1 — ძველი აპარატურის ემულაცია (IDE, legacy SCSI, სტანდარტული BIOS), 32/64-ბიტიანი OS. Gen 2 — UEFI (Secure Boot), VMBus სინთეტიკური აპარატურა, მხოლოდ 64-ბიტიანი OS.");
O(2,"ჩამოთვალეთ Hyper-V-ის სამი ტიპის ვირტუალური კომუტატორი.","External — VM-ები ფიზიკურ ქსელთან ფიზიკური NIC-ით; Internal — VM-ები და Host OS; Private — მხოლოდ VM-ები ერთმანეთთან.");
O(2,"რა განსხვავებაა Standard და Production checkpoints-ს შორის?","Standard — ინახავს დისკის ცვლილებებს და გაშვებული პროგრამების მეხსიერების მდგომარეობას. Production — იყენებს Guest OS-ის VSS-ს (ან Linux-ში fsfreeze) აპლიკაციურად მყარი ასლისთვის, მეხსიერების მდგომარეობის გარეშე.");
O(2,"რა აპარატურული და პროცესორული მოთხოვნები უნდა დაკმაყოფილდეს Hyper-V როლის დასაყენებლად?","64-ბიტიანი CPU აპარატურული ვირტუალიზაციით (Intel VT ან AMD-V), SLAT (Second Level Address Translation) მხარდაჭერა და საკმარისი RAM.");

O(2,"ჩამოთვალეთ FSMO როლები და მიუთითეთ რომელია ტყის და რომელი დომენის დონის.","ტყის დონე (1 თითო ტყეში): Schema Master, Domain Naming Master. დომენის დონე (1 თითო დომენში): PDC Emulator, RID Master, Infrastructure Master.",true);
O(2,"რა განსხვავებაა დომენს, ხეს და ტყეს შორის?","დომენი — ძირითადი ლოგიკური ერთეული, ცენტრალიზებული ავტენტიფიკაცია DC-ით. ხე — დომენები საერთო DNS სახელთა სივრცით (Contiguous) და ორმხრივი ტრანზიტული ნდობით. ტყე — უდიდესი კონტეინერი და უსაფრთხოების საზღვარი, ერთი ან მეტი ხე; პირველი დომენი = Forest Root Domain.",true);
O(2,"რა განსხვავებაა Member Server-ს, Domain Controller-სა და Standalone Server-ს შორის?","DC — AD DS როლით, ინახავს AD ბაზას, ახდენს ავტენტიფიკაციას. Member Server — დომენის წევრია, მაგრამ AD ბაზას არ ინახავს. Standalone — Workgroup-ის წევრია, დომენში არ შედის.",true);
O(2,"რა არის Global Catalog და რისთვის გამოიყენება?","DC, რომელიც ინახავს ტყის ყველა ობიექტის ატრიბუტების ნაწილობრივ (Read-Only Partial Attribute Set) ასლს — ობიექტების სწრაფი ძიებისა და Universal ჯგუფების წევრობის შესამოწმებლად.",true);
O(2,"რა განსხვავებაა SID-სა და GUID-ს შორის?","SID — უსაფრთხოების იდენტიფიკატორი, გამოიყენება ACL-ებში წვდომის კონტროლისთვის (RID Master-ის დიაპაზონებით იქმნება). GUID — 128-ბიტიანი გლობალურად უნიკალური იდენტიფიკატორი, ობიექტს განასხვავებს მთელ ტყეში.",true);
O(2,"რა განსხვავებაა Contiguous და Disjointed Namespace-ს შორის?","Contiguous — დომენები იზიარებენ საერთო ძირითად DNS სახელს (domainX.com და east.domainX.com, ერთი ხე). Disjointed — სხვადასხვა ხის დომენები განსხვავებული სახელებით.",true);
O(2,"რისთვის გამოიყენება RODC?","ფილიალებში (Branch Offices) დაბალი ფიზიკური უსაფრთხოების პირობებში; ინახავს AD ბაზის მხოლოდ წაკითხვად ასლს.",true);
O(2,"ჩამოთვალეთ AD-ის ადმინისტრირების MMC ინსტრუმენტები.","dsac.exe — AD Administrative Center; dsa.msc — AD Users and Computers; domain.msc — AD Domains and Trusts; dssite.msc — AD Sites and Services; DNS-ისთვის — DNS Manager (dnsmgmt.msc).",true);
O(2,"რა არის OU და რით განსხვავდება ჩაშენებული Users/Computers კონტეინერისგან?","OU — ადმინისტრატორის მიერ შექმნილი კონტეინერი ობიექტების დასაჯგუფებლად, რომელზეც შეიძლება GPO-ს მიბმა და დელეგირება. Users/Computers — ნაგულისხმევი კონტეინერებია, არა OU, მათზე GPO პირდაპირ ვერ მიებმება. ერთადერთი ნაგულისხმევი OU — Domain Controllers.",true);
O(2,"რა არის Trust Relationship და რა სახეები არსებობს?","მექანიზმი, რომლითაც ერთი დომენის მომხმარებლები წვდებიან მეორე დომენის რესურსებს. სახეები: Transitive, One-way/Two-way, Internal, External, Forest, Realm.",true);
O(2,"რა არის AD Schema?","წესების ნაკრები, რომელიც განსაზღვრავს AD ბაზის სტრუქტურას — ნებადართულ ობიექტთა ტიპებს (Classes) და მათ ატრიბუტებს (Attributes). ცვლილებებზე პასუხისმგებელია Schema Master.",true);
O(2,"რა არის DNS Forwarder?","პარამეტრი, რომლითაც DNS სერვერი მოთხოვნებს, რომლებზეც თავად არ აქვს პასუხი, გადაამისამართებს სხვა (მაგ. ISP-ის) DNS სერვერზე.",true);
O(2,"რატომ არის DNS აუცილებელი Active Directory-სთვის?","კლიენტები DC-ებსა და AD სერვისებს პოულობენ DNS-ის SRV ჩანაწერებით (_ldap, _kerberos); ამიტომ AD DS-ის დაყენებისას DNS-იც ყენდება და იქმნება AD-Integrated Primary ზონა.",true);

T(2,"რა არის გლობალური კატალოგის მიზანი Active Directory-ში?",["ტყეში არსებული ყველა ობიექტის შესახებ ინფორმაციის შენახვა","ინფორმაციის შენახვა დომენის ყველა ობიექტის შესახებ","ორგანიზაციის ყველა მომხმარებლის შესახებ ინფორმაციის შენახვა","ჯგუფის პოლიტიკის შესახებ ინფორმაციის შენახვა"],0,"GC ინახავს ტყის ყველა ობიექტის ატრიბუტების ნაწილობრივ ასლს.",0);

T(2,"რომელი ბრძანება გამოიყენება Windows სერვერის დომენის კონტროლერზე დასაწინაურებლად?",["dcpromo","promote","adconnect","dcsetup"],0,"dcpromo — ისტორიული ბრძანება; WS2019-ში Server Manager ან Install-ADDSDomainController.",0);

D(3,"აპლიკაციათა სერვერი (Application Server)","სერვერული სისტემა, რომელიც უზრუნველყოფს ორგანიზაციული ბიზნეს-ლოგიკისა და კლიენტ/სერვერული აპლიკაციების გაშვებას, მართვასა და მომხმარებლებისთვის სერვისების მიწოდებას.");
D(3,"Mail Server (მეილ სერვერი)","სერვერი, რომელიც პასუხისმგებელია ელფოსტის მიღებაზე, გაგზავნასა და საფოსტო ყუთებში შენახვაზე (მაგ. Exchange Server) MUA, MTA და MDA კომპონენტებით.");
D(3,"SMTP (Simple Mail Transfer Protocol)","ქსელური პროტოკოლი (პორტი 25), რომელიც უზრუნველყოფს ელფოსტის ტრანსპორტირებას სერვერებს შორის (MTA) და კლიენტიდან სერვერზე.");
D(3,"DHCP სერვერი","Windows Server-ის როლი, რომელიც მოწყობილობებს დინამიურად ანიჭებს IP მისამართს, Subnet Mask-ს, Default Gateway-ს, DNS სერვერის მისამართს და სხვა პარამეტრებს.");
D(3,"ვებ სერვერი (Web Server)","სერვერი, რომელიც ჰოსტინგს უწევს ვებ-საიტებსა და აპლიკაციებს, ამუშავებს ბრაუზერების HTTP/HTTPS მოთხოვნებს და უბრუნებს ვებ-გვერდებს.");
D(3,"ფაილ სერვერი (File Server)","სერვერული როლი (File and Storage Services) ფაილების ცენტრალიზებული შენახვისთვის, ქსელური გაზიარებისთვის (SMB/NFS) და წვდომის უფლებების მართვისთვის.");
D(3,"IPAM (IP Address Management)","Windows Server-ის ტექნოლოგია მრავალი DNS და DHCP სერვერის, IP სივრცისა და სუბნეტების ცენტრალიზებული მონიტორინგისა და ადმინისტრირებისთვის.");
D(3,"მონაცემთა ბაზის სერვერი (Database Server)","სერვერი, რომელიც უზრუნველყოფს მონაცემთა ბაზების (მაგ. SQL Server) შენახვას, დამუშავებასა და მართვას; კლიენტები უკავშირდებიან დრაივერებითა და პროტოკოლებით (ODBC, JDBC, OLE DB).");
D(3,"ODBC (Open Database Connectivity)","სტანდარტული API, რომელიც აპლიკაციებს აძლევს სხვადასხვა ტიპის მონაცემთა ბაზებთან დაკავშირებისა და მონაცემთა გაცვლის საშუალებას.");
D(3,"JDBC (Java Database Connectivity)","Java-ს სტანდარტული API (Sun Microsystems), რომლითაც Java აპლიკაციები უკავშირდებიან ბაზებს და ასრულებენ SQL მოთხოვნებს.");
D(3,"OLE DB (Object Linking and Embedding, Database)","Microsoft-ის API/ტექნოლოგია აპლიკაციების წვდომისთვის სხვადასხვა ფორმატის (რელაციურ და არარელაციურ) მონაცემთა წყაროებთან.");
D(3,"Collaboration Server (კოლაბორაციული სერვერი)","სერვერული აპლიკაცია (მაგ. SharePoint Server), რომელიც სხვადასხვა ლოკაციის გუნდის წევრებს აერთიანებს საერთო პროექტებზე, დოკუმენტებსა და ამოცანებზე სამუშაოდ.");
D(3,"IIS (Internet Information Services)","Microsoft-ის ჩაშენებული ვებ-სერვერული პროგრამა Windows Server-ში ვებ-საიტების, აპლიკაციებისა და სერვისების (HTTP, HTTPS, FTP, SMTP, ASP.NET) ჰოსტინგისა და მართვისთვის.");
D(3,"WWW (World Wide Web)","გლობალური საინფორმაციო სისტემა ინტერნეტში, სადაც რესურსები იდენტიფიცირდება URL-ებით, დაკავშირებულია ჰიპერლინკებით და ხელმისაწვდომია HTTP/HTTPS-ით.");
D(3,"HTML (Hypertext Markup Language)","სტანდარტული მარკირების ენა ვებ-გვერდების სტრუქტურისა და შინაარსის შესაქმნელად, რომელსაც ბრაუზერი ვიზუალურად გამოსახავს.");
D(3,"FTP (File Transfer Protocol)","სტანდარტული ქსელური პროტოკოლი (პორტები 20/21) ფაილების გადასაცემად კლიენტსა და სერვერს შორის.");
D(3,"CA (Certification Authority)","სერტიფიკაციის ორგანო/სერვერი (AD CS), რომელიც ადასტურებს იდენტობას და გასცემს ციფრულ სერტიფიკატებს.");
D(3,"PKI (Public Key Infrastructure)","აპარატურის, პროგრამებისა და პოლიტიკების ერთობლიობა ციფრული სერტიფიკატების შესაქმნელად, გასაცემად, სამართავად და გასაუქმებლად.");
D(3,"VPN (Virtual Private Network)","ტექნოლოგია, რომელიც საჯარო ინტერნეტით ქმნის დაშიფრულ ლოგიკურ გვირაბს დისტანციურ კლიენტსა და ორგანიზაციის შიდა ქსელს შორის.");
D(3,"Remote Access","Windows Server-ის როლი, რომლითაც ორგანიზაციის გარეთ მყოფი მომხმარებლები უსაფრთხოდ უკავშირდებიან შიდა რესურსებს (VPN, DirectAccess, RRAS, Web Application Proxy).");
D(3,"RSAT (Remote Server Administration Tools)","ინსტრუმენტების ნაკრები Windows 10/11-ზე ან სერვერზე, რომლითაც ადმინისტრატორი დისტანციურად მართავს სერვერის როლებს, ფუნქციებსა და AD-ს.");
D(3,"RDS (Remote Desktop Services)","სერვერული როლი (ყოფილი Terminal Services), რომელიც RDP-ით აძლევს წვდომას დისტანციურ სამუშაო მაგიდაზე ან RemoteApp აპლიკაციებზე.");
D(3,"RDG (Remote Desktop Gateway)","RDS-ის კომპონენტი, რომელიც RDP ტრაფიკს ფუთავს HTTPS-ში (პორტი 443), რათა ინტერნეტიდან ფაირვოლის გავლით უსაფრთხოდ დაუკავშირდნენ შიდა RDS სერვერებს.");
D(3,"MTA (Mail Transport Agent)","მეილ სერვერის კომპონენტი — ფოსტის ტრანსპორტირება მეილ სერვერებს შორის (SMTP).");
D(3,"MDA (Mail Delivery Agent)","მეილ სერვერის კომპონენტი — წერილის სერვერიდან მომხმარებლის Inbox-ში განთავსება.");
D(3,"MUA (Mail User Agent)","მომხმარებლის საფოსტო კლიენტი (მაგ. Outlook) წერილების დასაწერად და წასაკითხად.");
D(3,"POP3 (Post Office Protocol 3)","პროტოკოლი (პორტი 110) წერილების სერვერიდან ლოკალურ კომპიუტერზე ჩამოსატვირთად.");
D(3,"IMAP4 (Internet Message Access Protocol)","პროტოკოლი (პორტი 143) წერილების წასაკითხად და სერვერთან სინქრონიზაციისთვის, სერვერიდან წაშლის გარეშე.");
D(3,"მონიტორინგ სერვერი","სერვერი, რომელიც თვალყურს ადევნებს სერვერების ჯანმრთელობასა და წარმადობას (CPU, RAM, დისკები, ქსელი, სერვისები); მაგ. System Center 2019 Operations Manager.");
D(3,"ASP (Active Server Pages)","Microsoft-ის სერვერული სკრიპტინგის ტექნოლოგია IIS-ზე დინამიური ვებ-გვერდებისა და აპლიკაციების შესაქმნელად.");

D(3,"DHCP Reservation","DHCP-ის ფუნქცია, რომელიც კონკრეტული MAC მისამართის მქონე მოწყობილობას ყოველთვის ერთსა და იმავე IP-ს ანიჭებს.");
D(3,"DHCP Relay Agent","აგენტი, რომელიც DHCP ბროადქასტ მოთხოვნებს სხვა ქვექსელებიდან გადაამისამართებს ცენტრალურ DHCP სერვერზე.");

D(3,"Host Headers","IIS-ის ფუნქცია (Site Bindings), რომელიც ერთ IP მისამართზე რამდენიმე სხვადასხვა დომენური სახელის ვებსაიტის განთავსების საშუალებას იძლევა.");

D(3,"სისტემის ადმინისტრატორი","სპეციალისტი, რომელიც პასუხისმგებელია სერვერული ინფრასტრუქტურის, OS-ებისა და ქსელური სერვისების დანერგვაზე, კონფიგურაციაზე, უსაფრთხოებასა და შეუფერხებელ მუშაობაზე.");

O(3,"რას აკეთებს სისტემის ადმინისტრატორი?","პასუხისმგებელია ორგანიზაციის სერვერული ინფრასტრუქტურის, OS-ებისა და ქსელური სერვისების დანერგვაზე, კონფიგურაციაზე, უსაფრთხოებასა და შეუფერხებელ მუშაობაზე; მართავს ანგარიშებსა და წვდომებს, ფაილურ საცავებს, ვირტუალიზაციას, პროტოკოლებს, განახლებებსა და Backup-ს; ახორციელებს მონიტორინგსა და Troubleshooting-ს.");
O(3,"რატომ ირჩევენ პროფესიად სისტემის ადმინისტრატორობას?","დინამიური და მოთხოვნადი პროფესიაა; დამსაქმებლებს სჭირდებათ კრიტიკულად მოაზროვნე, შემოქმედებითი, პრობლემების გადამჭრელი სპეციალისტები; იძლევა კარიერული ზრდის, ცოდნის პრაქტიკაში რეალიზებისა და საერთაშორისო სერტიფიცირების (MTA, MCSA) შესაძლებლობას.");
O(3,"რა ამოცანები დგას სისტემის ადმინისტრატორის წინაშე?","სერვერების ინსტალაცია და პოსტ-ინსტალაცია (IP, სახელი, დომენი); ანგარიშებისა და წვდომების მართვა (AD, OU, Users, Groups, GPO, NTFS/Share); ქსელური სერვისები (DNS, DHCP, WINS, VPN, RDS); საცავები (Storage Pools, RAID, დედუპლიკაცია, კვოტები, Backup); უსაფრთხოება და მოვლა (WSUS, Defender, მონიტორინგი, Troubleshooting).");
O(3,"რა მოწყობილობებს და ტექნოლოგიებს იყენებს სისტემის ადმინისტრატორი?","აპარატურა: სერვერები (Rack, Blade, Tower), KVM, UPS, HDD/SSD/NVMe/SAN/NAS, NIC, როუტერები. მართვა: Server Manager, WAC, MMC (ADUC, Disk Management, Event Viewer), PowerShell, RSAT. ვირტუალიზაცია: Hyper-V, Docker/Windows Containers, WSL. პროტოკოლები: TCP/IP, DNS, DHCP, LDAP, Kerberos, SMB, NFS, HTTP/HTTPS, SSL/TLS, IPAM, RDP, VPN.");
O(3,"რა ვარიანტები არსებობს სისტემის ადმინისტრატორის კვალიფიკაციის დასადასტურებლად?","Microsoft-ის სერტიფიცირება: MTA (საბაზო, მაგ. 98-365 Windows Server Administration Fundamentals); MCSA და MCSD (პროფესიული); გამოცდები ბარდება Certiport-სა და Pearson VUE-ში.");
O(3,"რა არის აპლიკაციათა სერვერი?","სერვერი, რომელიც უზრუნველყოფს ბიზნეს-ლოგიკისა და კლიენტ/სერვერული აპლიკაციების გაშვებასა და მართვას ქსელში; მის კატეგორიაში შედის მეილ, მონაცემთა ბაზის, კოლაბორაციული, მონიტორინგისა და საფრთხეების მართვის სერვერები.");
O(3,"რა არის მეილ სერვერი?","აპლიკაციური სერვერი, რომელიც უზრუნველყოფს ელფოსტის მიღებას, გაგზავნასა და საფოსტო ყუთებში შენახვას (მაგ. Microsoft Exchange Server 2019).");
O(3,"რა არის მეილ სერვერის მთავარი კომპონენტები?","MTA (Mail Transport Agent) — ტრანსპორტირება სერვერებს შორის; MDA (Mail Delivery Agent) — წერილის Inbox-ში განთავსება; MUA (Mail User Agent) — საფოსტო კლიენტი (Outlook) წერისა და კითხვისთვის.");
O(3,"რა პროტოკოლებს იყენებს მეილ სერვერი?","SMTP (25) — გაგზავნა/ტრანსპორტი სერვერებს შორის; POP3 (110) — ჩამოტვირთვა ლოკალურ კომპიუტერზე; IMAP4 (143) — წაკითხვა და სინქრონიზაცია სერვერიდან წაშლის გარეშე.");
O(3,"რა წვდომის პროტოკოლები გამოიყენება მონაცემთა ბაზების სერვერებზე?","ODBC — სტანდარტული ინტერფეისი აპლიკაციების ბაზასთან დასაკავშირებლად; JDBC — Sun Microsystems-ის, Java აპლიკაციებისთვის; OLE DB — Microsoft-ის, სხვადასხვა მონაცემთა წყაროებთან წვდომისთვის.");
O(3,"რა არის მონიტორინგ სერვერი?","სერვერი, რომელიც თვალყურს ადევნებს სერვერების ჯანმრთელობასა და წარმადობას (CPU, RAM, დისკები, ქსელი, სერვისები, პროცესები); მაგ. System Center 2019 Operations Manager.");
O(3,"რა არის Active Server Pages (ASP)?","Microsoft-ის სერვერული სკრიპტინგის ტექნოლოგია, რომელიც IIS-ზე გამოიყენება დინამიური ვებ-გვერდებისა და აპლიკაციების შესაქმნელად.");
O(3,"რა არის SSL?","Secure Sockets Layer — ოქმი, რომელიც შიფრავს მონაცემთა არხს ვებ-სერვერსა და ბრაუზერს შორის; მუშაობს HTTPS-ით (პორტი 443) და იყენებს ციფრულ სერტიფიკატებს.");

O(3,"რა არის DHCP სერვერის ფუნქცია და რა პარამეტრებს გასცემს?","დინამიურად (იჯარით) ანიჭებს მოწყობილობებს IP მისამართს, Subnet Mask-ს, Default Gateway-ს (Option 003), DNS სერვერებს (Option 006); კონფიგურაცია: Scope, Lease Duration, Reservation. ამცირებს ადმინისტრაციულ ხარჯებს და IP კონფლიქტებს.",true);
O(3,"რა არის DHCP Relay Agent და რატომ არის საჭირო?","როუტერები არ ატარებენ ბროადქასტ (DHCPDISCOVER) პაკეტებს; Relay Agent ამ მოთხოვნებს სხვა ქვექსელებიდან გადაამისამართებს ცენტრალურ DHCP სერვერზე.",true);
O(3,"რა არის DHCP Reservation?","კონკრეტული MAC მისამართის მქონე მოწყობილობისთვის (პრინტერი, სერვერი) ყოველთვის ერთი და იგივე ფიქსირებული IP-ის მინიჭება DHCP-ით.",true);
O(3,"რომელ პორტებს იყენებს DHCP სერვერი და კლიენტი?","სერვერი — UDP 67, კლიენტი — UDP 68.",true);
O(3,"რა არის IIS და რა სერვისებს უწევს ჰოსტინგს?","Internet Information Services — Microsoft-ის ვებ-სერვერი Windows Server-ში; ჰოსტინგი: HTTP, HTTPS, FTP, SMTP, ASP.NET. ყენდება Web Server (IIS) როლით, იმართება IIS Manager-ით (Server Manager → Tools) ან PowerShell-ით.",true);
O(3,"რა განსხვავებაა Virtual Directory-სა და Document Root-ს შორის IIS-ში?","Document Root — ძირითადი საქაღალდე საიტის ფაილებით (C:\\inetpub\\wwwroot). Virtual Directory — URL ალიასი (მაგ. /xcontrol), რომელიც მიბმულია ფაილური სისტემის სხვა კონკრეტულ საქაღალდესთან.",true);
O(3,"რა უპირატესობა აქვს Application Pools-ს IIS-ში?","განცალკევებული Worker Process-ები იზოლაციას უკეთებს აპლიკაციებს — ერთი აპლიკაციის შეფერხება/გათიშვა სხვა აუზის აპლიკაციებზე გავლენას არ ახდენს.",true);
O(3,"როგორ შეიძლება ერთ IP მისამართზე რამდენიმე ვებსაიტის განთავსება IIS-ში?","Host Headers-ით (Site Bindings) — თითოეულ საიტს სხვადასხვა დომენური სახელი (FQDN) ენიჭება ერთსა და იმავე IP-ზე.",true);
O(3,"ჩამოთვალეთ ძირითადი პროტოკოლები და მათი ნაგულისხმევი პორტები (ქვიზ 3-ის მასალიდან).","HTTP — 80; HTTPS — 443; FTP — 20/21; SMTP — 25; POP3 — 110; IMAP4 — 143; DHCP — UDP 67 (სერვერი) / 68 (კლიენტი); SSH — 22.",true);
O(3,"რა განსხვავებაა RDS-სა და RDG-ს შორის?","RDS — როლი, რომელიც RDP-ით აძლევს დისტანციურ Desktop-ს ან RemoteApp-ს. RDG — RDS-ის კომპონენტი, რომელიც RDP-ს ფუთავს HTTPS-ში (443), რათა ინტერნეტიდან ფაირვოლის გავლით შიდა RDS-ს დაუკავშირდნენ.",true);
O(3,"რა განსხვავებაა CA-სა და PKI-ს შორის?","CA — ორგანო/სერვერი (AD CS), რომელიც გასცემს სერტიფიკატებს. PKI — მთელი ინფრასტრუქტურა (აპარატურა, პროგრამები, პოლიტიკები) სერტიფიკატების შექმნის, გაცემის, მართვისა და გაუქმებისთვის.",true);
O(3,"რა არის VPN და რომელი როლი უზრუნველყოფს მას Windows Server-ში?","დაშიფრული ლოგიკური გვირაბი საჯარო ინტერნეტით დისტანციურ კლიენტსა და შიდა ქსელს შორის; Remote Access როლი (VPN, DirectAccess, RRAS, Web Application Proxy).",true);
O(3,"რა არის RSAT და სად ინსტალირდება?","Remote Server Administration Tools — ინსტალირდება Windows 10/11-ზე ან სერვერზე სერვერის როლების, ფუნქციებისა და AD-ის დისტანციური მართვისთვის.",true);

D(4,"Print Server (პრინტ სერვერი)","სერვერი ან როლი (PDS-ის ნაწილი), რომელიც ცენტრალიზებულად მართავს ქსელურ პრინტერებს, დროებით ინახავს ბეჭდვის დავალებებს (Spooling), მართავს ბეჭდვის რიგებს და კლიენტებს ავტომატურად აწვდის დრაივერებს.");
D(4,"Network Printing (ქსელური ბეჭდვა)","ბეჭდვის პროცესი ქსელში, სადაც კლიენტები დავალებებს ქსელით გადასცემენ ქსელურ პრინტერს ან ცენტრალიზებულ პრინტ სერვერს.");
D(4,"Print Driver (პრინტერის დრაივერი)","პროგრამული კომპონენტი, რომლითაც OS და Print Spooler დოკუმენტს გარდაქმნის (Render) კონკრეტული საბეჭდი მოწყობილობისთვის გასაგებ ფორმატში — „თარჯიმანი“ OS-სა და პრინტერს შორის.");
D(4,"SMTP","სტანდარტული პროტოკოლი (TCP 25) ელფოსტის გადაცემისთვის მეილ სერვერებს შორის (MTA) და კლიენტიდან სერვერზე.");
D(4,"App-V (Application Virtualization)","Microsoft-ის ტექნოლოგია, რომელიც ვირტუალიზებულ აპლიკაციებს სერვერიდან სერვისად აწვდის; მომხმარებლისთვის ისინი ლოკალურად დაინსტალირებულივით მუშაობს.");
D(4,"MDOP (Microsoft Desktop Optimization Pack)","Microsoft-ის ინსტრუმენტების პაკეტი (მოიცავს App-V-ს) დესკტოპების ოპტიმიზაციის, აპლიკაციების ვირტუალიზაციისა და მართვისთვის.");
D(4,"PDS (Print and Document Services)","WS2019-ის როლი ბეჭდვისა და სკანირების სერვისების ცენტრალიზებული მართვისთვის; მოიცავს Print Server, Internet Printing და LPD Service კომპონენტებს.");
D(4,"LPD (Line Printer Daemon)","UNIX/Linux-ის ბეჭდვის გაზიარების სერვისი Windows Server-ში — არავინდოუსურ სისტემებს აძლევს LPR-ით ბეჭდვის საშუალებას.");
D(4,"LPR (Line Printer Request)","პორტის ტიპი და კლიენტური პროტოკოლი ბეჭდვის დავალებების გასაგზავნად LPD სერვისის მქონე პრინტ სერვერზე.");
D(4,"Internet Printing","PDS-ის როლის სერვისი, რომელიც HTTP/HTTPS-ით და IPP-ით (IIS-ის გავლით) აძლევს ინტერნეტით/ექსტრანეტით ბეჭდვის საშუალებას.");
D(4,"Local Printer","საბეჭდი მოწყობილობა, რომელიც ფიზიკურად პირდაპირ არის მიერთებული კომპიუტერთან (USB, LPT); მასპინძელს შეუძლია მისი გაზიარება.");
D(4,"Network Printer","დამოუკიდებელი საბეჭდი მოწყობილობა საკუთარი ქსელური ინტერფეისით (Ethernet, Wi-Fi, Bluetooth) და საკუთარი IP მისამართით.");
D(4,"Printer Pooling","ორი ან მეტი იდენტური (ერთი დრაივერის) ფიზიკური მოწყობილობის გაერთიანება ერთ ლოგიკურ პრინტერში; დავალება მიდის პირველ თავისუფალზე — დატვირთვის ბალანსი.");
D(4,"Web Printing","ბრაუზერით ბეჭდვა (http://servername/printers) და Web Management — რიგისა და საკუთარი დავალებების მართვა ბრაუზერიდან.");
D(4,"Print Device","Microsoft-ის ტერმინოლოგიით — ფიზიკური საბეჭდი აპარატურა.");
D(4,"Printer (ტერმინი)","Microsoft-ის ტერმინოლოგიით — ფიზიკური საბეჭდი მოწყობილობის პროგრამული წარმოდგენა OS-ში.");
D(4,"Print Spooler","Windows-ის სისტემური სერვისი — იღებს დავალებებს, დროებით ინახავს C:\\Windows\\System32\\spool\\PRINTERS-ში და გადასცემს საბეჭდ მოწყობილობას.");
D(4,"Spooling","ბეჭდვის დავალებების დროებით შენახვა spool საქაღალდეში, სანამ მოწყობილობა მზად იქნება.");
D(4,"Print Queue (ბეჭდვის რიგი)","ბეჭდვის დავალებების ჩამონათვალი, რომლებიც ელოდებიან საბეჭდი მოწყობილობის მიერ დამუშავებას.");
D(4,"PRINT$","პრინტ სერვერის ფარული გაზიარებული საქაღალდე, საიდანაც კლიენტები ავტომატურად იწერენ დრაივერებს.");
D(4,"BODP (Branch Office Direct Printing)","ფილიალის კლიენტები ბეჭდავენ პირდაპირ ფილიალის ქსელურ პრინტერზე ცენტრალური პრინტ სერვერის გვერდის ავლით — WAN ტრაფიკის დაზოგვა.");
D(4,"IPP (Internet Printing Protocol)","ბეჭდვის პროტოკოლი HTTP/HTTPS-ის გავლით; Windows Server-ის პრინტერების გაზიარების ერთ-ერთი პროტოკოლი (SMB და LPD-სთან ერთად).");
D(4,"User Rights (მომხმარებელთა უფლებები)","მომხმარებლის/ჯგუფის სისტემური უფლებამოსილებები OS-ში (ლოკალურად შესვლა, დროის შეცვლა, გათიშვა); ინიშნება User Rights Assignment-ით.");
D(4,"NTFS Permissions","წესები NTFS/ReFS ტომის ფაილებსა და საქაღალდეებზე წვდომისთვის; მოქმედებს ლოკალურადაც და ქსელიდანაც: Full control, Modify, Read & execute, List folder contents, Read, Write, Special.");
D(4,"Share Permissions","ქსელით (SMB/NFS) გაზიარებულ საქაღალდეებზე წვდომის უფლებები — მოქმედებს მხოლოდ ქსელიდან წვდომისას: Full Control, Change, Read.");
D(4,"Effective Access","რეალური წვდომა ქსელიდან — Share და NTFS ნებართვების ყველაზე შეზღუდული კომბინაცია.");
D(4,"Take Ownership","ფაილის/საქაღალდის მფლობელობის აღება; Administrators ჯგუფს ყოველთვის აქვს ეს უფლება.");
D(4,"Deny vs Allow","Windows-ის უსაფრთხოების მოდელში პირდაპირი Deny ყოველთვის სჭარბობს Allow-ს.");
D(4,"Printer Permissions","პრინტერის ნებართვები: Print, Manage Printers, Manage Documents, View Server, Manage Server.");
D(4,"Print Management","ინსტრუმენტი/კონსოლი ორგანიზაციაში ბეჭდვის პროცესების, რიგების, უფლებებისა და წვდომების ცენტრალიზებული კონტროლისა და მონიტორინგისთვის.");

O(4,"რა არის პრინტ სერვერის ფუნქცია?","ცენტრალიზებულად მართავს და ინაწილებს საბეჭდ მოწყობილობებს ქსელში: ქმნის გაზიარებულ პრინტერებს და მართავს წვდომას; იღებს დავალებებს, დროებით ინახავს (Spooling) და მართავს რიგებს (Print Queues); ცენტრალიზებულად ავრცელებს დრაივერებს და ახდენს მონიტორინგს.");
O(4,"რა არის Internet Printing?","PDS როლის სერვისი, რომელიც იყენებს HTTP/HTTPS-ს და IPP-ს; აკონფიგურირებს IIS-ს და მომხმარებლებს აძლევს გაზიარებულ პრინტერებზე ბეჭდვის საშუალებას ინტერნეტით ან ექსტრანეტით.");
O(4,"რა არის local printer?","საბეჭდი მოწყობილობა, რომელიც ფიზიკურად პირდაპირ არის მიერთებული კომპიუტერის პორტთან (USB, Parallel/LPT); ემსახურება ამ კომპიუტერს, თუმცა მასპინძელს შეუძლია ქსელში გაზიარება.");
O(4,"რა არის network printer?","დამოუკიდებელი საბეჭდი მოწყობილობა, ჩართული ქსელში საკუთარი ინტერფეისით (Ethernet, Wi-Fi, Bluetooth) და საკუთარი IP-ით; დავალებებს იღებს უშუალოდ ქსელით.");
O(4,"რა არის printer pooling?","ორი ან მეტი ფიზიკური მოწყობილობის (იდენტური ან ერთი დრაივერით) გაერთიანება ერთ ლოგიკურ პრინტერად; დავალება მიდის პირველ თავისუფალ მოწყობილობაზე — დატვირთვის ბალანსი და ეფექტურობა.");
O(4,"რა არის web printing?","ფაილების ბეჭდვა ვებ-ბრაუზერით (http://servername/printers) და Web Management — ბრაუზერიდან ბეჭდვის რიგის თვალყურის დევნება და საკუთარი დავალებების მართვა.");
O(4,"რა არის მომხმარებელთა უფლებები (User Rights)?","მომხმარებლის/ჯგუფის სისტემური უფლებამოსილებები OS-ში (ლოკალურად შესვლა, დროის შეცვლა, გათიშვა); ინიშნება ჯგუფური პოლიტიკით (User Rights Assignment) და განსხვავდება Permissions-ისგან, რომლებიც ობიექტებს ეხება.");
O(4,"რას გულისხმობს NTFS წვდომები?","წესები NTFS/ReFS ტომზე ფაილებსა და საქაღალდეებზე წვდომის დონისთვის; მოქმედებს ლოკალურადაც და ქსელიდანაც. საბაზო: Full control, Modify, Read & execute, List folder contents, Read, Write, Special permissions.");
O(4,"რა არის დაშეარების (Share) ნებართვები?","ქსელით (SMB/NFS) გაზიარებულ საქაღალდეებზე წვდომის უფლებები; მოქმედებს მხოლოდ ქსელიდან დაკავშირებისას. თუ საქაღალდე NTFS ტომზეა, საჭიროა როგორც Share, ისე NTFS ნებართვა.");
O(4,"რა წვდომის ტიპები არსებობს?","NTFS/ReFS: Full control, Modify, Read & execute, List folder contents, Read, Write, Special. Share: Full Control, Change, Read. პრინტერის: Print, Manage Printers, Manage Documents, View Server, Manage Server. თითოეული — Allow ან Deny.");

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

let TK=null;
function pickBalanced(arr,n,qs){
  const by={};qs.forEach(q=>by[q]=shuffle(arr.filter(x=>x.q===q)));
  const out=[];let i=0;const order=shuffle(qs);
  while(out.length<n){const q=order[i%order.length];if(by[q].length)out.push(by[q].pop());i++;if(qs.every(q=>!by[q].length))break}
  return shuffle(out);
}
R.ticket=function(){if(!TK)newTicket();else drawTicket()};
function ticketQs(){return [1,2,3,4].filter(q=>document.getElementById("tq"+q)?document.getElementById("tq"+q).checked:true)}
function newTicket(){
  const qs=ticketQs();if(!qs.length)return;
  const tpool=TESTS.concat(document.getElementById("tauto")&&!document.getElementById("tauto").checked?[]:AUTO.filter(x=>x.o.every(o=>o.length<140)));
  TK={qs,defs:pickBalanced(DEFS,5,qs).map(x=>({x,txt:"",m:0,open:false})),opens:pickBalanced(OPENS,5,qs).map(x=>({x,txt:"",m:0,open:false})),tests:pickBalanced(tpool,10,qs).map(x=>({x:prep(x),sel:-1})),done:false};
  drawTicket();
}

   <textarea oninput="TK.defs[${i}].txt=this.value" placeholder="შენი განმარტება...">${esc(it.txt)}</textarea>
   <div class="row" style="margin-top:8px"><button class="btn sec" onclick="TK.defs[${i}].open=!TK.defs[${i}].open;drawTicket()">${it.open?"დამალვა":"პასუხის ნახვა"}</button>${selfMark("defs",i)}</div>
   ${it.open?`<div class="ans">${esc(it.x.d)}</div>`:""}</div>`});
  h+=`<h2>II. უპასუხეთ კითხვებს (5)</h2>`;
  TK.opens.forEach((it,i)=>{h+=`<div class="card">${chips(it.x)}<div class="q"><span class="num">${i+1}.</span>${esc(it.x.t)}</div>
   <textarea oninput="TK.opens[${i}].txt=this.value" placeholder="შენი პასუხი..." style="min-height:90px">${esc(it.txt)}</textarea>
   <div class="row" style="margin-top:8px"><button class="btn sec" onclick="TK.opens[${i}].open=!TK.opens[${i}].open;drawTicket()">${it.open?"დამალვა":"პასუხის ნახვა"}</button>${selfMark("opens",i)}</div>
   ${it.open?`<div class="ans">${esc(it.x.a)}</div>`:""}</div>`});
  h+=`<h2>III. ტესტები (10)</h2>`;
  TK.tests.forEach((it,i)=>{const t=it.x;h+=`<div class="card">${chips(t.src)}<div class="q"><span class="num">${i+1}.</span>${esc(t.s)}</div>`;
    t.o.forEach((o,j)=>{let c="";if(TK.done){if(t.a.includes(j))c="ok";else if(it.sel===j)c="bad"}else if(it.sel===j)c="sel";
      h+=`<button class="opt ${c}" ${TK.done?"disabled":""} onclick="TK.tests[${i}].sel=${j};drawTicket()"><span class="l">${L[j]})</span>${esc(o)}</button>`});
    if(TK.done&&t.e)h+=`<div class="expl">${esc(t.e)}</div>`;h+=`</div>`});
  if(!TK.done)h+=`<div class="row"><button class="btn" onclick="gradeTicket()">ბილეთის შემოწმება</button></div>`;
  else{const ok=TK.tests.filter(it=>it.x.a.includes(it.sel)).length;const dm=TK.defs.filter(x=>x.m===1).length,om=TK.opens.filter(x=>x.m===1).length;
    h+=`<div class="card"><div class="score">ტესტები: ${ok}/10 · განმარტებები: ${dm}/5 · ღია: ${om}/5</div><div class="mute">განმარტებები და ღია კითხვები შენი თვითშეფასებით ითვლება. არასწორი ტესტები დაემატა „შეცდომებს“.</div><div class="row" style="margin-top:10px"><button class="btn" onclick="newTicket()">შემდეგი ბილეთი</button></div></div>`}
  el.innerHTML=h;
}
function selfMark(k,i){const m=TK[k][i].m;return `<div class="self"><button class="okb ${m===1?"on":""}" onclick="TK.${k}[${i}].m=1;drawTicket()">✓ ვიცოდი</button><button class="badb ${m===-1?"on":""}" onclick="TK.${k}[${i}].m=-1;drawTicket()">✗ ვერ ვიცოდი</button></div>`}
function gradeTicket(){TK.done=true;TK.defs.concat(TK.opens).forEach(x=>x.open=true);TK.tests.forEach(it=>{if(!it.x.a.includes(it.sel))addMist(it.x.src);});drawTicket();window.scrollTo(0,document.body.scrollHeight)}

// ---------- test practice ----------
let TP=null;
R.tests=function(){if(!TP)setupTests();else drawTest()};
function setupTests(){
  const el=document.getElementById("tests");
  el.innerHTML=`<div class="card filters"><div class="row"><b>ქვიზები:</b>${[1,2,3,4].map(q=>`<label><input type="checkbox" class="pq" value="${q}" checked> ${QN[q]}</label>`).join("")}</div>
  <div class="row" style="margin-top:8px"><b>ტიპი:</b><label><input type="checkbox" class="pk" value="orig" checked> ორიგინალი</label><label><input type="checkbox" class="pk" value="var" checked> ვარიანტები</label><label><input type="checkbox" class="pk" value="auto"> განმარტებებიდან</label></div>
  <div class="row" style="margin-top:10px"><button class="btn" onclick="startTests()">დაწყება</button></div></div><div id="tbox"></div>`;
}
function startTests(){
  const qs=[...document.querySelectorAll(".pq:checked")].map(x=>+x.value),ks=[...document.querySelectorAll(".pk:checked")].map(x=>x.value);
  const pool=shuffle(ALLTESTS().filter(t=>qs.includes(t.q)&&ks.includes(t.kind)));
  if(!pool.length)return;
  TP={list:pool.map(prep),i:0,sel:-1,ok:0,bad:0};drawTest();
}
function drawTest(){
  const box=document.getElementById("tbox");if(!box){setupTests();return}
  if(!TP){box.innerHTML="";return}
  if(TP.i>=TP.list.length){box.innerHTML=`<div class="card"><div class="score">დასრულდა: ${TP.ok} სწორი, ${TP.bad} შეცდომა</div><div class="row" style="margin-top:10px"><button class="btn" onclick="startTests()">თავიდან</button></div></div>`;return}
  const t=TP.list[TP.i];const ans=TP.sel>=0;
  let h=`<div class="card"><div class="row" style="justify-content:space-between"><div>${chips(t.src)}</div><div class="mute">${TP.i+1} / ${TP.list.length} · ✓ ${TP.ok} · ✗ ${TP.bad}</div></div>
  <div class="bar"><div style="width:${100*TP.i/TP.list.length}%"></div></div><div class="q" style="margin-top:12px">${esc(t.s)}</div>`;
  t.o.forEach((o,j)=>{let c="";if(ans){if(t.a.includes(j))c="ok";else if(TP.sel===j)c="bad"}
    h+=`<button class="opt ${c}" ${ans?"disabled":""} onclick="answerTest(${j})"><span class="l">${L[j]})</span>${esc(o)}</button>`});
  if(ans){if(t.e)h+=`<div class="expl">${esc(t.e)}</div>`;h+=`<div class="row" style="margin-top:12px"><button class="btn" onclick="TP.i++;TP.sel=-1;drawTest()">შემდეგი →</button></div>`}
  box.innerHTML=h+`</div>`;
}
function answerTest(j){const t=TP.list[TP.i];TP.sel=j;if(t.a.includes(j)){TP.ok++;delMist(t.src)}else{TP.bad++;addMist(t.src)}drawTest()}

// ---------- flashcards ----------
let FC=null;
R.flash=function(){if(!FC)setupFlash();else drawFlash()};
function setupFlash(){
  document.getElementById("flash").innerHTML=`<div class="card filters"><div class="row"><b>ქვიზები:</b>${[1,2,3,4].map(q=>`<label><input type="checkbox" class="fq" value="${q}" checked> ${QN[q]}</label>`).join("")}</div>
  <div class="row" style="margin-top:8px"><b>რა:</b><label><input type="radio" name="fk" value="d" checked> განმარტებები</label><label><input type="radio" name="fk" value="o"> ღია კითხვები</label><label><input type="radio" name="fk" value="b"> ორივე</label></div>
  <div class="row" style="margin-top:10px"><button class="btn" onclick="startFlash()">დაწყება</button></div></div><div id="fbox"></div>`;
}
function startFlash(){
  const qs=[...document.querySelectorAll(".fq:checked")].map(x=>+x.value),k=document.querySelector("input[name=fk]:checked").value;
  let pool=[];if(k!=="o")pool=pool.concat(DEFS.filter(x=>qs.includes(x.q)).map(x=>({q:x.q,f:x.t,b:x.d,tp:"განმარტება"})));
  if(k!=="d")pool=pool.concat(OPENS.filter(x=>qs.includes(x.q)).map(x=>({q:x.q,f:x.t,b:x.a,tp:"ღია კითხვა",v:x.v})));
  if(!pool.length)return;FC={list:shuffle(pool),i:0,flip:false,know:0,again:[]};drawFlash();
}
function drawFlash(){
  const box=document.getElementById("fbox");if(!box){setupFlash();return}if(!FC)return;
  if(FC.i>=FC.list.length){
    box.innerHTML=`<div class="card"><div class="score">ვიცი: ${FC.know} · გასამეორებელი: ${FC.again.length}</div><div class="row" style="margin-top:10px">${FC.again.length?`<button class="btn" onclick="FC={list:shuffle(FC.again),i:0,flip:false,know:0,again:[]};drawFlash()">გასამეორებლების გავლა</button>`:""}<button class="btn sec" onclick="startFlash()">თავიდან</button></div></div>`;return}
  const c=FC.list[FC.i];
  box.innerHTML=`<div class="mute" style="margin-top:10px">${FC.i+1} / ${FC.list.length} · ${c.tp}</div>
  <div class="card flash" onclick="FC.flip=!FC.flip;drawFlash()"><div>${chips(c)}</div><div style="font-weight:700;margin-top:8px">${esc(c.f)}</div>
  ${FC.flip?`<div class="back">${esc(c.b)}</div>`:`<div class="mute" style="margin-top:12px">დააჭირე პასუხის სანახავად</div>`}</div>
  <div class="row"><button class="btn" style="background:var(--ok)" onclick="FC.know++;FC.i++;FC.flip=false;drawFlash()">✓ ვიცი</button><button class="btn" style="background:var(--bad)" onclick="FC.again.push(FC.list[FC.i]);FC.i++;FC.flip=false;drawFlash()">✗ გავიმეორო</button></div>`;
}

// ---------- mistakes ----------
let MP=null;
R.mist=function(){
  const el=document.getElementById("mist");
  const pool=ALLTESTS().filter(t=>MIST.includes(t.s));
  if(!MP||MP.done){
    el.innerHTML=`<div class="card"><h3>შეცდომები: ${pool.length}</h3><p class="mute" style="margin:0 0 10px">აქ გროვდება ტესტები, რომლებშიც შეცდი (ტესტებსა და ბილეთში). სწორად უპასუხებ — სიიდან ამოიშლება.</p>
    <div class="row"><button class="btn" ${pool.length?"":"disabled"} onclick="MP={list:shuffle(ALLTESTS().filter(t=>MIST.includes(t.s))).map(prep),i:0,sel:-1};drawMist()">გამეორება</button><button class="btn ghost" ${pool.length?"":"disabled"} onclick="if(confirm('გავასუფთავო სია?')){MIST=[];store.set('mist',MIST);R.mist()}">სიის გასუფთავება</button></div></div>`;return}
  drawMist();
};
function drawMist(){
  const el=document.getElementById("mist");
  if(MP.i>=MP.list.length){MP.done=true;R.mist();return}
  const t=MP.list[MP.i],ans=MP.sel>=0;
  let h=`<div class="card"><div class="row" style="justify-content:space-between"><div>${chips(t.src)}</div><div class="mute">${MP.i+1} / ${MP.list.length}</div></div><div class="q" style="margin-top:10px">${esc(t.s)}</div>`;
  t.o.forEach((o,j)=>{let c="";if(ans){if(t.a.includes(j))c="ok";else if(MP.sel===j)c="bad"}
    h+=`<button class="opt ${c}" ${ans?"disabled":""} onclick="MP.sel=${j};if(MP.list[MP.i].a.includes(${j}))delMist(MP.list[MP.i].src);drawMist()"><span class="l">${L[j]})</span>${esc(o)}</button>`});
  if(ans){if(t.e)h+=`<div class="expl">${esc(t.e)}</div>`;h+=`<div class="row" style="margin-top:12px"><button class="btn" onclick="MP.i++;MP.sel=-1;drawMist()">შემდეგი →</button></div>`}
  el.innerHTML=h+`</div>`;
}

// ---------- browse ----------
R.all=function(){
  const el=document.getElementById("all");
  if(!el.dataset.init){el.dataset.init=1;
    el.innerHTML=`<div class="card"><div class="row"><input type="search" id="sq" placeholder="ძებნა (მაგ. DHCP, SMTP, OU, Spooler...)" oninput="drawAll()"></div>
    <div class="row filters" style="margin-top:10px"><select id="sqz" onchange="drawAll()"><option value="0">ყველა ქვიზი</option>${[1,2,3,4].map(q=>`<option value="${q}">${QN[q]}</option>`).join("")}</select>
    <select id="stp" onchange="drawAll()"><option value="d">განმარტებები</option><option value="o">ღია კითხვები</option><option value="t">ტესტები</option></select></div></div><div id="alist" class="card list"></div>`}
  drawAll();
};
function drawAll(){
  const s=(document.getElementById("sq").value||"").toLowerCase(),qz=+document.getElementById("sqz").value,tp=document.getElementById("stp").value;
  const f=x=>(!qz||x.q===qz);let h="",n=0;
  if(tp==="d")DEFS.filter(f).filter(x=>(x.t+x.d).toLowerCase().includes(s)).forEach(x=>{n++;h+=`<div class="item">${chips(x)}<b>${esc(x.t)}</b> — ${esc(x.d)}</div>`});
  if(tp==="o")OPENS.filter(f).filter(x=>(x.t+x.a).toLowerCase().includes(s)).forEach(x=>{n++;h+=`<div class="item">${chips(x)}<div class="q">${esc(x.t)}</div><div class="ans">${esc(x.a)}</div></div>`});
  if(tp==="t")TESTS.filter(f).filter(x=>(x.s+x.o.join(" ")).toLowerCase().includes(s)).forEach(x=>{n++;h+=`<div class="item">${chips(x)}<div class="q">${esc(x.s)}</div>${x.o.map((o,j)=>`<div style="${x.a.includes(j)?"color:var(--ok);font-weight:700":""}">${L[j]}) ${esc(o)}${x.a.includes(j)?" ✓":""}</div>`).join("")}${x.e?`<div class="expl">${esc(x.e)}</div>`:""}</div>`});
  document.getElementById("alist").innerHTML=`<div class="mute">ნაპოვნია: ${n}</div>`+h;
}
R.home();
</script>
